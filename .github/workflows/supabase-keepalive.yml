# Supabase 免費專案 7 天沒有使用會自動暫停。每天查一次公開的角色名單，讓專案保持在使用中。
# 需要在 GitHub repo 的 Settings → Secrets and variables → Actions 設定 SUPABASE_URL 與 SUPABASE_ANON_KEY。
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *' # 每天 UTC 03:17（台灣 11:17）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query players
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "未設定 SUPABASE_URL / SUPABASE_ANON_KEY，略過"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/players?select=id&limit=1"
